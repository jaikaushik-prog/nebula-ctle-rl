## Notes on fidelity to the paper

- **Eq. 1 (focal loss):** implemented exactly as `(1 - exp(-||R-y||^2))^gamma
  * ||R-y||^2`, gamma=2, averaged over the batch.
- **Eq. 2 (reward):** implemented exactly; verified non-positive by
  `tests/test_pipeline.py::test_reward_nonpositive`.
- **Eq. 3–4 (discriminator + penalty):** implemented exactly; verified that
  the penalty is maximized (=0) at the D(a)=0.5 boundary.
- **Fig. 2 mode scheduling:** the online-mode "every K steps" and
  discriminator "every B steps, batch 2K" logic is unit-tested
  (`test_online_mode_spice_call_scheduling`) — this caught a real off-by-one
  bug during development (single-shot episodes were double-incrementing the
  step counter via both `reset()` and `step()`, which silently prevented
  any K-multiple from ever being hit). Worth knowing if you extend the env.
- **Table II/III's "Time (s) per 1k steps":** measured directly as wall-clock
  training time, not estimated — comparable in spirit to the paper's
  reported numbers but will differ with hardware and with your
  `call_cost_s` setting.
